<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="100%" height="100%" class="sketch-svg">
  
  <defs>
    <!-- Paper Texture Filter -->
    <filter id="paper-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#fdfbf7" surfaceScale="1.2" result="light">
        <feDistantLight azimuth="60" elevation="50" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light" />
    </filter>

    <!-- Watercolor Bleed Filter -->
    <filter id="watercolor-wash" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" result="rough" />
      <feDisplacementMap in="SourceGraphic" in2="rough" scale="8" xChannelSelector="R" yChannelSelector="G" result="displaced" />
      <feGaussianBlur stdDeviation="2.5" result="blurred" />
      <feMerge>
        <feMergeNode in="blurred" />
        <feMergeNode in="displaced" opacity="0.8" />
      </feMerge>
    </filter>

    <!-- Ink Hatching Pattern 45 deg -->
    <pattern id="hatch-45" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#2b2b2b" stroke-width="0.8" opacity="0.45" />
    </pattern>

    <!-- Cross Hatching Pattern -->
    <pattern id="cross-hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#1f1f1f" stroke-width="0.7" opacity="0.4" />
      <line x1="0" y1="0" x2="8" y2="0" stroke="#1f1f1f" stroke-width="0.7" opacity="0.4" />
    </pattern>

    <!-- Dense Hatching for Architectural Poche -->
    <pattern id="dense-poche" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#202020" stroke-width="1.2" opacity="0.65" />
    </pattern>
  </defs>

  <rect width="1100" height="850" fill="#faf8f5" />

  <!-- Architectural Grid & Compass -->
  <g opacity="0.25" stroke="#72a9e8" stroke-width="0.8">
    <line x1="550" y1="50" x2="550" y2="800" stroke-dasharray="6,6" />
    <line x1="50" y1="425" x2="1050" y2="425" stroke-dasharray="6,6" />
    <circle cx="550" cy="425" r="320" fill="none" stroke-dasharray="4,8" />
  </g>

  <!-- Title Block (Architectural Drafting Style) -->
  <g id="drafting-title-block" transform="translate(60, 60)">
    <rect x="0" y="0" width="280" height="65" fill="#ffffff" stroke="#1c1c1c" stroke-width="1.8" />
    <rect x="0" y="0" width="280" height="18" fill="#72a9e8" fill-opacity="0.6" filter="url(#watercolor-wash)" />
    <text x="10" y="13" font-family="'Montserrat', sans-serif" font-size="9" font-weight="700" fill="#1c1c1c" letter-spacing="1.5">MUSEUM EXHIBITION PLAN • LEVEL 01</text>
    <text x="10" y="36" font-family="'Montserrat', sans-serif" font-size="13" font-weight="700" fill="#1c1c1c" letter-spacing="1">PAST: ROTUNDA GALLERIES</text>
    <text x="10" y="52" font-family="'Montserrat', sans-serif" font-size="9.5" font-weight="500" fill="#666" letter-spacing="1">SCALE 1:100 • SELECT A GALLERY ROOM</text>
  </g>

  <!-- Compass Rose (Architectural North) -->
  <g id="compass" transform="translate(980, 100)">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#222" stroke-width="1.2" />
    <polygon points="0,-28 6,-5 0,0 -6,-5" fill="#1c1c1c" />
    <polygon points="0,28 6,5 0,0 -6,5" fill="#bbb" stroke="#222" stroke-width="0.8" />
    <text x="0" y="-33" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" fill="#1c1c1c" text-anchor="middle">N</text>
  </g>

  <!-- Scale Bar -->
  <g id="scalebar" transform="translate(60, 780)">
    <rect x="0" y="0" width="160" height="6" fill="none" stroke="#222" stroke-width="1" />
    <rect x="0" y="0" width="40" height="6" fill="#222" />
    <rect x="80" y="0" width="40" height="6" fill="#222" />
    <text x="0" y="18" font-family="'Montserrat', sans-serif" font-size="8" fill="#555">0m</text>
    <text x="80" y="18" font-family="'Montserrat', sans-serif" font-size="8" fill="#555">5m</text>
    <text x="160" y="18" font-family="'Montserrat', sans-serif" font-size="8" fill="#555">10m</text>
  </g>

  <!-- ================= ROTUNDA CENTRAL HALL ================= -->
  <!-- Outer Rotunda Wall -->
  <circle cx="550" cy="425" r="175" fill="#ffffff" stroke="#1c1c1c" stroke-width="3" />
  <circle cx="550" cy="425" r="167" fill="none" stroke="#1c1c1c" stroke-width="1.5" stroke-dasharray="8,5" />
  
  <!-- Central Oculus / Fountain Bench -->
  <circle cx="550" cy="425" r="55" fill="#f4efe6" stroke="#1c1c1c" stroke-width="2.2" />
  <circle cx="550" cy="425" r="50" fill="url(#hatch-45)" opacity="0.3" />
  <circle cx="550" cy="425" r="28" fill="#72a9e8" fill-opacity="0.6" filter="url(#watercolor-wash)" stroke="#1c1c1c" stroke-width="1.5" />
  <circle cx="550" cy="425" r="8" fill="#1c1c1c" />

  <!-- Radial Floor Tiles Lines -->
  <g stroke="#888" stroke-width="0.8" opacity="0.5">
    <line x1="550" y1="250" x2="550" y2="370" />
    <line x1="550" y1="480" x2="550" y2="600" />
    <line x1="375" y1="425" x2="495" y2="425" />
    <line x1="605" y1="425" x2="725" y2="425" />
    <line x1="426" y1="301" x2="511" y2="386" />
    <line x1="589" y1="464" x2="674" y2="549" />
    <line x1="674" y1="301" x2="589" y2="386" />
    <line x1="511" y1="464" x2="426" y2="549" />
  </g>

  <!-- Entrance Hall / Vestibule (from bottom / home) -->
  <g id="vestibule">
    <polygon points="505,600 595,600 610,710 490,710" fill="#ffffff" stroke="#1c1c1c" stroke-width="2.2" />
    <line x1="500" y1="640" x2="600" y2="640" stroke="#777" stroke-width="1" />
    <line x1="495" y1="675" x2="605" y2="675" stroke="#777" stroke-width="1" />
    <path d="M 550 700 L 550 635 M 542 645 L 550 635 L 558 645" stroke="#1c1c1c" stroke-width="2" fill="none" />
    <text x="550" y="730" font-family="'Montserrat', sans-serif" font-size="9" font-weight="700" fill="#555" text-anchor="middle" letter-spacing="1">MUSEUM ENTRANCE</text>
  </g>

  <!-- ================= 6 EXHIBITION ROOMS ================= -->

  <!-- ROOM 1: Digital paintings (Top-Left) -->
  <g id="room-digital-paintings" class="floorplan-room-group" data-room-id="digital-paintings" cursor="pointer">
    <polygon points="415,315 450,285 410,235 375,265" fill="#fff" stroke="#1c1c1c" stroke-width="2" />
    <rect x="180" y="120" width="220" height="150" rx="4" fill="#ffffff" stroke="#1c1c1c" stroke-width="2.5" class="room-rect" />
    <rect x="185" y="125" width="210" height="140" fill="url(#hatch-45)" opacity="0.08" />
    <rect x="180" y="120" width="220" height="150" rx="4" fill="#72a9e8" fill-opacity="0.0" class="room-wash" filter="url(#watercolor-wash)" />
    
    <path d="M 385 240 A 25 25 0 0 1 405 265" fill="none" stroke="#222" stroke-width="1.2" stroke-dasharray="3,3" />
    <line x1="385" y1="240" x2="405" y2="240" stroke="#222" stroke-width="1.5" />
    
    <circle cx="215" cy="155" r="14" fill="#72a9e8" fill-opacity="0.6" filter="url(#watercolor-wash)" stroke="#1c1c1c" stroke-width="1.2" />
    <text x="215" y="160" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" fill="#1c1c1c" text-anchor="middle">01</text>
    
    <text x="240" y="153" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" fill="#1c1c1c" letter-spacing="0.5">DIGITAL PAINTINGS</text>
    <text x="240" y="169" font-family="'Montserrat', sans-serif" font-size="9.5" font-weight="500" fill="#666" letter-spacing="1">4 ARTWORKS</text>
    
    <g transform="translate(290, 190)" stroke="#1c1c1c" stroke-width="1.2" fill="none">
      <line x1="0" y1="45" x2="18" y2="0" />
      <line x1="36" y1="45" x2="18" y2="0" />
      <line x1="18" y1="0" x2="18" y2="45" stroke-dasharray="2,2" />
      <rect x="4" y="12" width="28" height="20" fill="#fff" stroke="#1c1c1c" stroke-width="1.2" />
      <rect x="7" y="15" width="22" height="14" fill="#72a9e8" fill-opacity="0.4" />
    </g>
    <rect x="200" y="235" width="90" height="20" rx="3" fill="#1c1c1c" class="room-btn" />
    <text x="245" y="249" font-family="'Montserrat', sans-serif" font-size="8.5" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0.8">ENTER ROOM</text>
  </g>

  <!-- ROOM 2: Models (Top-Center) -->
  <g id="room-models" class="floorplan-room-group" data-room-id="models" cursor="pointer">
    <polygon points="520,250 580,250 580,200 520,200" fill="#fff" stroke="#1c1c1c" stroke-width="2" />
    <rect x="440" y="50" width="220" height="150" rx="4" fill="#ffffff" stroke="#1c1c1c" stroke-width="2.5" class="room-rect" />
    <rect x="445" y="55" width="210" height="140" fill="url(#hatch-45)" opacity="0.08" />
    <rect x="440" y="50" width="220" height="150" rx="4" fill="#72a9e8" fill-opacity="0.0" class="room-wash" filter="url(#watercolor-wash)" />
    
    <path d="M 535 200 A 25 25 0 0 1 560 175" fill="none" stroke="#222" stroke-width="1.2" stroke-dasharray="3,3" />
    <line x1="535" y1="200" x2="535" y2="175" stroke="#222" stroke-width="1.5" />

    <circle cx="475" cy="85" r="14" fill="#72a9e8" fill-opacity="0.6" filter="url(#watercolor-wash)" stroke="#1c1c1c" stroke-width="1.2" />
    <text x="475" y="90" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" fill="#1c1c1c" text-anchor="middle">02</text>
    
    <text x="500" y="83" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" fill="#1c1c1c" letter-spacing="0.5">MODELS</text>
    <text x="500" y="99" font-family="'Montserrat', sans-serif" font-size="9.5" font-weight="500" fill="#666" letter-spacing="1">2 DISPLAY PEDESTALS</text>

    <g transform="translate(525, 115)" stroke="#1c1c1c" stroke-width="1.2" fill="none">
      <rect x="5" y="16" width="16" height="24" fill="#eee" />
      <rect x="7" y="4" width="12" height="12" fill="#72a9e8" fill-opacity="0.5" stroke-dasharray="2,2" />
      <rect x="29" y="14" width="16" height="26" fill="#eee" />
      <rect x="31" y="2" width="12" height="12" fill="#72a9e8" fill-opacity="0.5" stroke-dasharray="2,2" />
    </g>

    <rect x="505" y="165" width="90" height="20" rx="3" fill="#1c1c1c" class="room-btn" />
    <text x="550" y="179" font-family="'Montserrat', sans-serif" font-size="8.5" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0.8">ENTER ROOM</text>
  </g>

  <!-- ROOM 3: Pencil (Top-Right) -->
  <g id="room-pencil" class="floorplan-room-group" data-room-id="pencil" cursor="pointer">
    <polygon points="685,315 650,285 690,235 725,265" fill="#fff" stroke="#1c1c1c" stroke-width="2" />
    <rect x="700" y="120" width="220" height="150" rx="4" fill="#ffffff" stroke="#1c1c1c" stroke-width="2.5" class="room-rect" />
    <rect x="705" y="125" width="210" height="140" fill="url(#hatch-45)" opacity="0.08" />
    <rect x="700" y="120" width="220" height="150" rx="4" fill="#72a9e8" fill-opacity="0.0" class="room-wash" filter="url(#watercolor-wash)" />

    <circle cx="735" cy="155" r="14" fill="#72a9e8" fill-opacity="0.6" filter="url(#watercolor-wash)" stroke="#1c1c1c" stroke-width="1.2" />
    <text x="735" y="160" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" fill="#1c1c1c" text-anchor="middle">03</text>
    
    <text x="760" y="153" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" fill="#1c1c1c" letter-spacing="0.5">PENCIL</text>
    <text x="760" y="169" font-family="'Montserrat', sans-serif" font-size="9.5" font-weight="500" fill="#666" letter-spacing="1">6 STUDIES</text>

    <g transform="translate(800, 195) rotate(-35)" stroke="#1c1c1c" stroke-width="1.2" fill="none">
      <rect x="0" y="0" width="35" height="7" fill="#fff" />
      <polygon points="35,0 45,3.5 35,7" fill="#1c1c1c" />
      <line x1="6" y1="0" x2="6" y2="7" />
    </g>

    <rect x="765" y="235" width="90" height="20" rx="3" fill="#1c1c1c" class="room-btn" />
    <text x="810" y="249" font-family="'Montserrat', sans-serif" font-size="8.5" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0.8">ENTER ROOM</text>
  </g>

  <!-- ROOM 4: Sketches (Bottom-Right) -->
  <g id="room-sketches" class="floorplan-room-group" data-room-id="sketches" cursor="pointer">
    <polygon points="685,535 650,565 690,615 725,585" fill="#fff" stroke="#1c1c1c" stroke-width="2" />
    <rect x="700" y="550" width="220" height="150" rx="4" fill="#ffffff" stroke="#1c1c1c" stroke-width="2.5" class="room-rect" />
    <rect x="705" y="555" width="210" height="140" fill="url(#hatch-45)" opacity="0.08" />
    <rect x="700" y="550" width="220" height="150" rx="4" fill="#72a9e8" fill-opacity="0.0" class="room-wash" filter="url(#watercolor-wash)" />

    <circle cx="735" cy="585" r="14" fill="#72a9e8" fill-opacity="0.6" filter="url(#watercolor-wash)" stroke="#1c1c1c" stroke-width="1.2" />
    <text x="735" y="590" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" fill="#1c1c1c" text-anchor="middle">04</text>
    
    <text x="760" y="583" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" fill="#1c1c1c" letter-spacing="0.5">SKETCHES</text>
    <text x="760" y="599" font-family="'Montserrat', sans-serif" font-size="9.5" font-weight="500" fill="#666" letter-spacing="1">3 ARCHITECTURAL WORKS</text>

    <g transform="translate(800, 615)" stroke="#1c1c1c" stroke-width="1.2" fill="none">
      <path d="M 0 35 L 0 10 L 15 0 L 30 10 L 30 35 Z" />
      <path d="M 10 35 L 10 20 Q 15 15 20 20 L 20 35" />
      <line x1="15" y1="0" x2="15" y2="-6" stroke-width="1.5" />
    </g>

    <rect x="765" y="665" width="90" height="20" rx="3" fill="#1c1c1c" class="room-btn" />
    <text x="810" y="679" font-family="'Montserrat', sans-serif" font-size="8.5" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0.8">ENTER ROOM</text>
  </g>

  <!-- ROOM 5: Vietnamese Lacquered Painting (Son Mai) -->
  <g id="room-lacquer" class="floorplan-room-group" data-room-id="vietnamese-lacquered-painting" cursor="pointer">
    <polygon points="375,540 435,590 400,630 340,580" fill="#fff" stroke="#1c1c1c" stroke-width="2" />
    <rect x="180" y="600" width="250" height="150" rx="4" fill="#ffffff" stroke="#1c1c1c" stroke-width="2.5" class="room-rect" />
    <rect x="185" y="605" width="240" height="140" fill="url(#hatch-45)" opacity="0.08" />
    <rect x="180" y="600" width="250" height="150" rx="4" fill="#72a9e8" fill-opacity="0.0" class="room-wash" filter="url(#watercolor-wash)" />

    <circle cx="215" cy="635" r="14" fill="#72a9e8" fill-opacity="0.6" filter="url(#watercolor-wash)" stroke="#1c1c1c" stroke-width="1.2" />
    <text x="215" y="640" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" fill="#1c1c1c" text-anchor="middle">05</text>
    
    <text x="240" y="630" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" fill="#1c1c1c" letter-spacing="0.3">VIETNAMESE LACQUERED</text>
    <text x="240" y="644" font-family="'Montserrat', sans-serif" font-size="10.5" font-weight="700" fill="#1c1c1c" letter-spacing="0.3">PAINTING (SƠN MÀI)</text>
    <text x="240" y="659" font-family="'Montserrat', sans-serif" font-size="9" font-weight="500" fill="#666" letter-spacing="1">2 MASTERPIECES</text>

    <g transform="translate(350, 670)" stroke="#1c1c1c" stroke-width="1.2" fill="none">
      <rect x="0" y="0" width="38" height="26" rx="2" fill="#2b2620" />
      <circle cx="19" cy="13" r="7" fill="#72a9e8" fill-opacity="0.8" />
    </g>

    <rect x="240" y="715" width="90" height="20" rx="3" fill="#1c1c1c" class="room-btn" />
    <text x="285" y="729" font-family="'Montserrat', sans-serif" font-size="8.5" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0.8">ENTER ROOM</text>
  </g>

  <!-- ROOM 6: Others (Left-Middle) -->
  <g id="room-others" class="floorplan-room-group" data-room-id="others" cursor="pointer">
    <polygon points="375,410 375,450 310,450 310,410" fill="#fff" stroke="#1c1c1c" stroke-width="2" />
    <rect x="90" y="360" width="220" height="145" rx="4" fill="#ffffff" stroke="#1c1c1c" stroke-width="2.5" class="room-rect" />
    <rect x="95" y="365" width="210" height="135" fill="url(#hatch-45)" opacity="0.08" />
    <rect x="90" y="360" width="220" height="145" rx="4" fill="#72a9e8" fill-opacity="0.0" class="room-wash" filter="url(#watercolor-wash)" />

    <circle cx="125" cy="395" r="14" fill="#72a9e8" fill-opacity="0.6" filter="url(#watercolor-wash)" stroke="#1c1c1c" stroke-width="1.2" />
    <text x="125" y="400" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" fill="#1c1c1c" text-anchor="middle">06</text>
    
    <text x="150" y="393" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" fill="#1c1c1c" letter-spacing="0.5">OTHERS</text>
    <text x="150" y="409" font-family="'Montserrat', sans-serif" font-size="9.5" font-weight="500" fill="#666" letter-spacing="1">1 STILL LIFE WORK</text>

    <g transform="translate(245, 420)" stroke="#1c1c1c" stroke-width="1.2" fill="none">
      <ellipse cx="14" cy="24" rx="10" ry="4" />
      <path d="M 4 24 Q 0 14 7 8 L 10 4 L 18 4 L 21 8 Q 28 14 24 24" />
      <path d="M 7 8 Q 1 6 1 12 Q 1 18 6 18" />
    </g>

    <rect x="155" y="465" width="90" height="20" rx="3" fill="#1c1c1c" class="room-btn" />
    <text x="200" y="479" font-family="'Montserrat', sans-serif" font-size="8.5" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0.8">ENTER ROOM</text>
  </g>
</svg>