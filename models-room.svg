<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750" width="100%" height="100%" class="sketch-svg">
  
  <defs>
    <!-- Paper Texture Filter -->
    <filter id="paper-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#fdfbf7" surfaceScale="1.2" result="light">
        <feDistantLight azimuth="60" elevation="50" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light" />
    </filter>

    <!-- Watercolor Bleed Filter -->
    <filter id="watercolor-wash" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" result="rough" />
      <feDisplacementMap in="SourceGraphic" in2="rough" scale="8" xChannelSelector="R" yChannelSelector="G" result="displaced" />
      <feGaussianBlur stdDeviation="2.5" result="blurred" />
      <feMerge>
        <feMergeNode in="blurred" />
        <feMergeNode in="displaced" opacity="0.8" />
      </feMerge>
    </filter>

    <!-- Ink Hatching Pattern 45 deg -->
    <pattern id="hatch-45" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#2b2b2b" stroke-width="0.8" opacity="0.45" />
    </pattern>

    <!-- Cross Hatching Pattern -->
    <pattern id="cross-hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#1f1f1f" stroke-width="0.7" opacity="0.4" />
      <line x1="0" y1="0" x2="8" y2="0" stroke="#1f1f1f" stroke-width="0.7" opacity="0.4" />
    </pattern>

    <!-- Dense Hatching for Architectural Poche -->
    <pattern id="dense-poche" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#202020" stroke-width="1.2" opacity="0.65" />
    </pattern>
  </defs>

  <rect width="1100" height="750" fill="#faf8f5" />

  <!-- Room Interior in Perspective -->
  <!-- Back Wall -->
  <polygon points="120,80 980,80 980,520 120,520" fill="#f4efe6" stroke="#1c1c1c" stroke-width="2.5" />
  <!-- Side Walls & Ceiling -->
  <polygon points="0,0 120,80 120,520 0,750" fill="#ece5d8" stroke="#1c1c1c" stroke-width="2" />
  <polygon points="1100,0 980,80 980,520 1100,750" fill="#ece5d8" stroke="#1c1c1c" stroke-width="2" />
  <polygon points="0,0 1100,0 980,80 120,80" fill="#f9f7f2" stroke="#1c1c1c" stroke-width="1.8" />
  
  <!-- Floor Grid -->
  <polygon points="0,750 120,520 980,520 1100,750" fill="#f1ebe0" stroke="#1c1c1c" stroke-width="2" />
  <g stroke="#3a3835" stroke-width="1" opacity="0.45">
    <line x1="550" y1="520" x2="550" y2="750" />
    <line x1="335" y1="520" x2="220" y2="750" />
    <line x1="765" y1="520" x2="880" y2="750" />
    <line x1="60" y1="635" x2="1040" y2="635" />
  </g>

  <!-- Architectural Molding & Ceiling Track Lights -->
  <line x1="120" y1="120" x2="980" y2="120" stroke="#1c1c1c" stroke-width="1.5" />
  <line x1="200" y1="60" x2="900" y2="60" stroke="#1c1c1c" stroke-width="2" />
  
  <!-- Spotlights Cones shining on Pedestals -->
  <polygon points="340,60 180,480 480,480" fill="#72a9e8" fill-opacity="0.08" filter="url(#watercolor-wash)" />
  <polygon points="760,60 600,480 900,480" fill="#72a9e8" fill-opacity="0.08" filter="url(#watercolor-wash)" />

  <!-- Room Header Plaque -->
  <g transform="translate(425, 100)">
    <rect x="0" y="0" width="250" height="46" rx="3" fill="#ffffff" stroke="#1c1c1c" stroke-width="1.8" />
    <rect x="0" y="0" width="250" height="12" fill="#72a9e8" fill-opacity="0.6" filter="url(#watercolor-wash)" />
    <text x="125" y="32" font-family="'Montserrat', sans-serif" font-size="13" font-weight="700" fill="#1c1c1c" text-anchor="middle" letter-spacing="1.5">MODELS EXHIBITION</text>
  </g>

  <!-- ================= PEDESTAL 1 (LEFT): BUS STOP TOTORO ================= -->
  <g id="pedestal-totoro" class="clickable-pedestal" data-subfolder="bus-stop-totoro" cursor="pointer">
    <!-- Pedestal Plinth Shadow -->
    <ellipse cx="330" cy="580" rx="120" ry="25" fill="#72a9e8" fill-opacity="0.3" filter="url(#watercolor-wash)" />
    
    <!-- Solid Plinth Base -->
    <polygon points="210,340 450,340 435,570 225,570" fill="#ffffff" stroke="#1c1c1c" stroke-width="2.5" class="pedestal-base" />
    <polygon points="205,335 455,335 450,345 210,345" fill="#ece5d8" stroke="#1c1c1c" stroke-width="1.8" />
    <line x1="225" y1="570" x2="435" y2="570" stroke="#1c1c1c" stroke-width="2" />
    <!-- Architectural Plinth Hatching -->
    <line x1="220" y1="360" x2="220" y2="550" stroke="#1c1c1c" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="440" y1="360" x2="440" y2="550" stroke="#1c1c1c" stroke-width="1" stroke-dasharray="4,4" />
    
    <!-- Glass Vitrine (Tủ kính trưng bày) -->
    <!-- Vitrine Back -->
    <polygon points="235,170 425,170 425,335 235,335" fill="#ffffff" opacity="0.6" stroke="#1c1c1c" stroke-width="1.5" stroke-dasharray="4,4" />
    
    <!-- Inside Model Silhouette: Bus Stop Totoro -->
    <g class="model-silhouette" transform="translate(300, 205)" stroke="#1c1c1c" stroke-width="1.6" fill="none">
      <!-- Bus Stop Sign Pole -->
      <line x1="15" y1="125" x2="15" y2="25" stroke-width="2.2" />
      <circle cx="15" cy="20" r="14" fill="#ffffff" stroke-width="1.8" />
      <circle cx="15" cy="20" r="9" fill="#72a9e8" fill-opacity="0.6" />
      <!-- Totoro Silhouette with Umbrella -->
      <path d="M 40 125 C 35 80 50 55 65 55 C 80 55 95 80 90 125 Z" fill="#2b2620" />
      <!-- Ears -->
      <path d="M 52 55 L 50 38 L 56 48 Z" fill="#2b2620" />
      <path d="M 78 55 L 80 38 L 74 48 Z" fill="#2b2620" />
      <!-- Umbrella -->
      <path d="M 40 40 Q 65 15 90 40 Z" fill="#72a9e8" fill-opacity="0.8" stroke="#1c1c1c" stroke-width="1.5" />
      <line x1="65" y1="20" x2="65" y2="70" stroke-width="1.5" />
      <!-- Small Satsuki & Mei Silhouette -->
      <path d="M 22 125 L 22 95 Q 26 90 30 95 L 30 125 Z" fill="#444" />
      <circle cx="26" cy="88" r="4" fill="#444" />
    </g>

    <!-- Vitrine Front Glass & Reflections -->
    <polygon points="225,160 435,160 445,335 215,335" fill="#72a9e8" fill-opacity="0.15" filter="url(#watercolor-wash)" stroke="#1c1c1c" stroke-width="2" class="vitrine-glass" />
    <!-- Glass Diagonal Reflection Lines -->
    <g stroke="#ffffff" stroke-width="2" opacity="0.85">
      <line x1="245" y1="320" x2="340" y2="180" />
      <line x1="265" y1="320" x2="360" y2="180" />
      <line x1="390" y1="320" x2="430" y2="260" />
    </g>

    <!-- Plaque on Front of Pedestal -->
    <g class="pedestal-plaque">
      <rect x="250" y="420" width="160" height="50" rx="3" fill="#72a9e8" fill-opacity="0.6" filter="url(#watercolor-wash)" />
      <rect x="255" y="415" width="150" height="46" rx="2" fill="#ffffff" stroke="#1c1c1c" stroke-width="1.8" />
      <text x="330" y="435" font-family="'Montserrat', sans-serif" font-size="11.5" font-weight="700" fill="#1c1c1c" text-anchor="middle" letter-spacing="1">BUS STOP TOTORO</text>
      <text x="330" y="450" font-family="'Montserrat', sans-serif" font-size="9" font-weight="600" fill="#555" text-anchor="middle" letter-spacing="0.8">CLICK TO INSPECT</text>
    </g>
  </g>

  <!-- ================= PEDESTAL 2 (RIGHT): THE CITY'S INDUSTRIALISM ================= -->
  <g id="pedestal-industrialism" class="clickable-pedestal" data-subfolder="the-city-industrialism" cursor="pointer">
    <!-- Pedestal Plinth Shadow -->
    <ellipse cx="750" cy="580" rx="120" ry="25" fill="#72a9e8" fill-opacity="0.3" filter="url(#watercolor-wash)" />
    
    <!-- Solid Plinth Base -->
    <polygon points="630,340 870,340 855,570 645,570" fill="#ffffff" stroke="#1c1c1c" stroke-width="2.5" class="pedestal-base" />
    <polygon points="625,335 875,335 870,345 630,345" fill="#ece5d8" stroke="#1c1c1c" stroke-width="1.8" />
    <line x1="645" y1="570" x2="855" y2="570" stroke="#1c1c1c" stroke-width="2" />
    <line x1="640" y1="360" x2="640" y2="550" stroke="#1c1c1c" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="860" y1="360" x2="860" y2="550" stroke="#1c1c1c" stroke-width="1" stroke-dasharray="4,4" />

    <!-- Vitrine Back -->
    <polygon points="655,150 845,150 845,335 655,335" fill="#ffffff" opacity="0.6" stroke="#1c1c1c" stroke-width="1.5" stroke-dasharray="4,4" />

    <!-- Inside Model Silhouette: The City's Industrialism -->
    <g class="model-silhouette" transform="translate(685, 180)" stroke="#1c1c1c" stroke-width="1.5" fill="none">
      <!-- Industrial Towers & Trusses -->
      <polygon points="10,150 25,30 45,30 60,150" stroke-width="1.8" fill="#f0eee9" />
      <line x1="25" y1="50" x2="45" y2="50" />
      <line x1="20" y1="80" x2="50" y2="80" />
      <line x1="15" y1="110" x2="55" y2="110" />
      <line x1="25" y1="50" x2="50" y2="80" />
      <line x1="45" y1="50" x2="20" y2="80" />
      <!-- Chimney Stack with Smoke Puff -->
      <rect x="75" y="40" width="16" height="110" fill="#2b2620" />
      <line x1="75" y1="60" x2="91" y2="60" stroke="#fff" stroke-width="1" />
      <path d="M 83 35 Q 95 20 85 10 Q 75 0 90 -10" stroke="#72a9e8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />
      <!-- Factory Gable Roof -->
      <polygon points="90,150 90,95 115,75 140,95 140,150" fill="#ece5d8" stroke-width="1.8" />
    </g>

    <!-- Vitrine Front Glass & Reflections -->
    <polygon points="645,140 855,140 865,335 635,335" fill="#72a9e8" fill-opacity="0.15" filter="url(#watercolor-wash)" stroke="#1c1c1c" stroke-width="2" class="vitrine-glass" />
    <g stroke="#ffffff" stroke-width="2" opacity="0.85">
      <line x1="665" y1="320" x2="760" y2="160" />
      <line x1="685" y1="320" x2="780" y2="160" />
      <line x1="810" y1="320" x2="850" y2="250" />
    </g>

    <!-- Plaque on Front of Pedestal -->
    <g class="pedestal-plaque">
      <rect x="660" y="420" width="180" height="50" rx="3" fill="#72a9e8" fill-opacity="0.6" filter="url(#watercolor-wash)" />
      <rect x="665" y="415" width="170" height="46" rx="2" fill="#ffffff" stroke="#1c1c1c" stroke-width="1.8" />
      <text x="750" y="435" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" fill="#1c1c1c" text-anchor="middle" letter-spacing="0.5">THE CITY'S INDUSTRIALISM</text>
      <text x="750" y="450" font-family="'Montserrat', sans-serif" font-size="9" font-weight="600" fill="#555" text-anchor="middle" letter-spacing="0.8">CLICK TO INSPECT</text>
    </g>
  </g>
</svg>