<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" class="sketch-svg">
  
  <defs>
    <!-- Paper Texture Filter -->
    <filter id="paper-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#fdfbf7" surfaceScale="1.2" result="light">
        <feDistantLight azimuth="60" elevation="50" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light" />
    </filter>

    <!-- Watercolor Bleed Filter -->
    <filter id="watercolor-wash" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" result="rough" />
      <feDisplacementMap in="SourceGraphic" in2="rough" scale="8" xChannelSelector="R" yChannelSelector="G" result="displaced" />
      <feGaussianBlur stdDeviation="2.5" result="blurred" />
      <feMerge>
        <feMergeNode in="blurred" />
        <feMergeNode in="displaced" opacity="0.8" />
      </feMerge>
    </filter>

    <!-- Ink Hatching Pattern 45 deg -->
    <pattern id="hatch-45" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#2b2b2b" stroke-width="0.8" opacity="0.45" />
    </pattern>

    <!-- Cross Hatching Pattern -->
    <pattern id="cross-hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#1f1f1f" stroke-width="0.7" opacity="0.4" />
      <line x1="0" y1="0" x2="8" y2="0" stroke="#1f1f1f" stroke-width="0.7" opacity="0.4" />
    </pattern>

    <!-- Dense Hatching for Architectural Poche -->
    <pattern id="dense-poche" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#202020" stroke-width="1.2" opacity="0.65" />
    </pattern>
  </defs>

  <!-- Background Paper -->
  <rect width="1200" height="800" fill="#faf8f5" />
  
  <!-- Architectural Vanishing Point: (600, 360) -->
  
  <!-- CEILING & SKYLIGHT -->
  <!-- Perspective Ceiling Rays -->
  <g stroke="#262626" stroke-width="1.2" opacity="0.85" fill="none">
    <line x1="600" y1="360" x2="0" y2="0" stroke-width="2" />
    <line x1="600" y1="360" x2="200" y2="0" />
    <line x1="600" y1="360" x2="400" y2="0" />
    <line x1="600" y1="360" x2="600" y2="0" stroke-dasharray="8,6" opacity="0.5" />
    <line x1="600" y1="360" x2="800" y2="0" />
    <line x1="600" y1="360" x2="1000" y2="0" />
    <line x1="600" y1="360" x2="1200" y2="0" stroke-width="2" />
  </g>

  <!-- Transverse Coffer Beams -->
  <g stroke="#222" stroke-width="1.5" fill="none">
    <!-- Beam 1 (top foreground) -->
    <path d="M -50 90 L 1250 90 M -50 110 L 1250 110" />
    <rect x="0" y="90" width="1200" height="20" fill="url(#hatch-45)" opacity="0.35" />
    
    <!-- Beam 2 (mid ceiling) -->
    <path d="M 120 190 L 1080 190 M 120 205 L 1080 205" />
    <rect x="120" y="190" width="960" height="15" fill="url(#hatch-45)" opacity="0.3" />
    
    <!-- Beam 3 (far ceiling architrave) -->
    <path d="M 270 280 L 930 280 M 270 290 L 930 290" />
  </g>

  <!-- Central Skylight Octagon & Sun Wash -->
  <g id="skylight">
    <polygon points="540,60 660,60 740,140 740,210 660,250 540,250 460,210 460,140" fill="none" stroke="#222" stroke-width="1.8" />
    <polygon points="555,75 645,75 720,145 720,200 645,235 555,235 480,200 480,145" fill="none" stroke="#222" stroke-width="1" stroke-dasharray="5,4" />
    
    <!-- Watercolor Skylight Wash (#72a9e8 at 60% and gradients) -->
    <polygon points="540,60 660,60 740,140 740,210 660,250 540,250 460,210 460,140" fill="#72a9e8" fill-opacity="0.35" filter="url(#watercolor-wash)" />
    <!-- Downward Light Wash Stream -->
    <polygon points="520,250 680,250 820,520 380,520" fill="#72a9e8" fill-opacity="0.12" filter="url(#watercolor-wash)" />
  </g>

  <!-- Suspended Modernist Chandelier -->
  <g id="chandelier" stroke="#222">
    <line x1="600" y1="120" x2="600" y2="240" stroke-width="1.5" />
    <line x1="596" y1="120" x2="596" y2="240" stroke-width="0.8" opacity="0.6" />
    <circle cx="600" cy="245" r="7" fill="#222" />
    <ellipse cx="600" cy="265" rx="55" ry="12" fill="none" stroke-width="2" />
    <ellipse cx="600" cy="265" rx="50" ry="10" fill="#72a9e8" fill-opacity="0.45" filter="url(#watercolor-wash)" />
    <ellipse cx="600" cy="275" rx="35" ry="8" fill="none" stroke-width="1.2" />
  </g>

  <!-- BACK WALL (Z=0, Center Focus) -->
  <g id="back-wall">
    <!-- Back Wall Contour -->
    <rect x="360" y="280" width="480" height="240" fill="#f4efe6" stroke="#222" stroke-width="2.5" />
    
    <!-- Grand Center Portal Frame ("What I did" - Past) -->
    <g id="portal-center-frame">
      <rect x="440" y="310" width="320" height="210" fill="#ece4d8" stroke="#1f1f1f" stroke-width="2.5" />
      <path d="M 440 380 Q 600 290 760 380" fill="none" stroke="#1f1f1f" stroke-width="2.5" />
      <path d="M 448 385 Q 600 300 752 385" fill="none" stroke="#222" stroke-width="1.2" stroke-dasharray="6,4" />
      <!-- Arch Keystone -->
      <polygon points="590,320 610,320 615,295 585,295" fill="#f4efe6" stroke="#222" stroke-width="1.5" />
      
      <!-- Inside Portal: Rotunda Vista Silhouette -->
      <path d="M 460 520 L 460 390 Q 600 320 740 390 L 740 520 Z" fill="#e8dfd3" />
      <!-- Rotunda Dome Silhouette -->
      <path d="M 520 450 Q 600 380 680 450 L 680 520 L 520 520 Z" fill="none" stroke="#555" stroke-width="1.2" stroke-dasharray="4,4" />
      <circle cx="600" cy="425" r="18" fill="none" stroke="#555" stroke-width="1" />
      <!-- Distant Gallery Artwork Silhouettes -->
      <rect x="480" y="430" width="30" height="40" fill="#c4baa9" stroke="#333" stroke-width="1" />
      <rect x="690" y="430" width="30" height="40" fill="#c4baa9" stroke="#333" stroke-width="1" />
      <!-- Visitor Silhouettes (architectural sketch figures) -->
      <g stroke="#333" stroke-width="1.2" fill="#333" opacity="0.65">
        <circle cx="585" cy="460" r="3" />
        <line x1="585" y1="463" x2="585" y2="485" />
        <circle cx="612" cy="463" r="2.8" />
        <line x1="612" y1="466" x2="612" y2="485" />
      </g>
    </g>

    <!-- Architectural Pilasters beside Portal -->
    <g stroke="#222" stroke-width="1.8" fill="#f4efe6">
      <rect x="380" y="280" width="45" height="240" />
      <line x1="395" y1="280" x2="395" y2="520" stroke-width="1" />
      <line x1="410" y1="280" x2="410" y2="520" stroke-width="1" />
      <!-- Pilaster Capital -->
      <path d="M 375 295 L 430 295 M 375 285 L 430 285" stroke-width="1.5" />
      
      <rect x="775" y="280" width="45" height="240" />
      <line x1="790" y1="280" x2="790" y2="520" stroke-width="1" />
      <line x1="805" y1="280" x2="805" y2="520" stroke-width="1" />
      <path d="M 770 295 L 825 295 M 770 285 L 825 285" stroke-width="1.5" />
    </g>
  </g>

  <!-- LEFT WALL ("What I'm doing" - Present / Construction Studio) -->
  <g id="left-wall">
    <!-- Wall perspective plane -->
    <polygon points="0,0 360,280 360,520 0,800" fill="#ede7dc" stroke="#222" stroke-width="2" />
    
    <!-- Left Arched Portal -->
    <polygon points="60,220 280,310 280,520 60,650" fill="#ded5c4" stroke="#222" stroke-width="2.2" />
    <path d="M 60 300 Q 170 230 280 310" fill="none" stroke="#222" stroke-width="2.5" />
    
    <!-- Inside Portal: Construction Studio Elements (ladder, paint can, scaffold) -->
    <g stroke="#333" stroke-width="1.5" opacity="0.75" fill="none">
      <!-- Leaning ladder in perspective -->
      <line x1="120" y1="580" x2="190" y2="350" stroke-width="2" />
      <line x1="135" y1="590" x2="205" y2="360" stroke-width="2" />
      <line x1="130" y1="550" x2="145" y2="560" />
      <line x1="145" y1="500" x2="160" y2="510" />
      <line x1="160" y1="450" x2="175" y2="460" />
      <line x1="175" y1="400" x2="190" y2="410" />
      <!-- Paint Bucket -->
      <rect x="220" y="470" width="30" height="35" rx="3" fill="#faf8f5" stroke-width="1.5" />
      <path d="M 225 470 L 235 445" stroke-width="2" /> <!-- Brush handle -->
    </g>
    
    <!-- Left Wall Moldings & Picture Rail -->
    <line x1="0" y1="120" x2="360" y2="280" stroke="#222" stroke-width="1.5" />
    <line x1="0" y1="200" x2="360" y2="320" stroke="#222" stroke-width="1.2" stroke-dasharray="10,5" />
  </g>

  <!-- RIGHT WALL ("What I plan to do" - Future / Drafting Sketchbook) -->
  <g id="right-wall">
    <!-- Wall perspective plane -->
    <polygon points="1200,0 840,280 840,520 1200,800" fill="#ede7dc" stroke="#222" stroke-width="2" />
    
    <!-- Right Arched Alcove / Portal -->
    <polygon points="1140,220 920,310 920,520 1140,650" fill="#ded5c4" stroke="#222" stroke-width="2.2" />
    <path d="M 1140 300 Q 1030 230 920 310" fill="none" stroke="#222" stroke-width="2.5" />
    
    <!-- Inside Portal: Drafting Station Silhouette (drafting table, lamp, open sketchbook) -->
    <g stroke="#333" stroke-width="1.5" opacity="0.75" fill="none">
      <!-- Drafting table surface -->
      <polygon points="950,470 1080,430 1110,480 970,530" fill="#f7f3eb" stroke-width="1.8" />
      <line x1="970" y1="530" x2="970" y2="600" stroke-width="2" />
      <line x1="1080" y1="480" x2="1080" y2="560" stroke-width="2" />
      <!-- Open Sketchbook on table -->
      <polygon points="990,470 1030,455 1070,475 1030,490" fill="#fff" stroke="#222" stroke-width="1.2" />
      <line x1="1030" y1="455" x2="1030" y2="490" stroke-width="1.5" />
    </g>
    
    <!-- Right Wall Moldings & Picture Rail -->
    <line x1="1200" y1="120" x2="840" y2="280" stroke="#222" stroke-width="1.5" />
    <line x1="1200" y1="200" x2="840" y2="320" stroke="#222" stroke-width="1.2" stroke-dasharray="10,5" />
  </g>

  <!-- PARQUET / LIMESTONE FLOOR -->
  <g id="floor">
    <!-- Floor polygon -->
    <polygon points="0,800 360,520 840,520 1200,800" fill="#f2ece1" stroke="#222" stroke-width="2" />
    
    <!-- Floor Radial Perspective Lines -->
    <g stroke="#3a3835" stroke-width="1" opacity="0.6">
      <line x1="600" y1="360" x2="-200" y2="800" />
      <line x1="600" y1="360" x2="100" y2="800" />
      <line x1="600" y1="360" x2="300" y2="800" />
      <line x1="600" y1="360" x2="450" y2="800" />
      <line x1="600" y1="360" x2="600" y2="800" stroke-width="1.5" />
      <line x1="600" y1="360" x2="750" y2="800" />
      <line x1="600" y1="360" x2="900" y2="800" />
      <line x1="600" y1="360" x2="1100" y2="800" />
      <line x1="600" y1="360" x2="1400" y2="800" />
    </g>

    <!-- Transverse Floor Planks / Flagstone Bands -->
    <g stroke="#3a3835" stroke-width="1.2" opacity="0.7">
      <line x1="320" y1="550" x2="880" y2="550" />
      <line x1="260" y1="600" x2="940" y2="600" />
      <line x1="180" y1="670" x2="1020" y2="670" />
      <line x1="80" y1="750" x2="1120" y2="750" />
    </g>

    <!-- Polished Floor Watercolor Reflections (#72a9e8 at 60%) -->
    <ellipse cx="600" cy="560" rx="140" ry="25" fill="#72a9e8" fill-opacity="0.3" filter="url(#watercolor-wash)" />
    <ellipse cx="250" cy="680" rx="90" ry="20" fill="#72a9e8" fill-opacity="0.25" filter="url(#watercolor-wash)" />
    <ellipse cx="950" cy="680" rx="90" ry="20" fill="#72a9e8" fill-opacity="0.25" filter="url(#watercolor-wash)" />
  </g>

  <!-- ============================================== -->
  <!-- 3 INTERACTIVE PORTALS / DIRECTIONAL TARGETS     -->
  <!-- ============================================== -->

  <!-- TARGET 1: "What I did" - Past (CENTER) -->
  <g id="hotspot-past" class="museum-hotspot hotspot-center" data-target="past" cursor="pointer">
    <!-- Hover Backdrop & Wash -->
    <rect x="420" y="320" width="360" height="280" rx="8" fill="transparent" class="hotspot-bg" />
    <path d="M 450 515 L 600 350 L 750 515 Z" fill="#72a9e8" fill-opacity="0.0" class="hotspot-wash" filter="url(#watercolor-wash)" />

    <!-- Big Hand-drawn Perspective Floor Arrow -->
    <g class="arrow-group">
      <!-- Watercolor shadow underneath arrow -->
      <path d="M 600 480 L 530 570 L 575 570 L 575 640 L 625 640 L 625 570 L 670 570 Z" 
            fill="#72a9e8" fill-opacity="0.6" filter="url(#watercolor-wash)" class="arrow-wash" />
      
      <!-- Architectural Fineliner Arrow Strokes -->
      <path d="M 600 480 L 530 570 L 575 570 L 575 640 L 625 640 L 625 570 L 670 570 Z" 
            fill="#ffffff" stroke="#1c1c1c" stroke-width="2.5" stroke-linejoin="round" class="arrow-body" />
      
      <!-- Inner sketch hatching inside arrow -->
      <line x1="585" y1="580" x2="615" y2="580" stroke="#1c1c1c" stroke-width="1.2" />
      <line x1="585" y1="600" x2="615" y2="600" stroke="#1c1c1c" stroke-width="1.2" />
      <line x1="585" y1="620" x2="615" y2="620" stroke="#1c1c1c" stroke-width="1.2" />
      <line x1="590" y1="510" x2="600" y2="495" stroke="#1c1c1c" stroke-width="1.5" />
    </g>

    <!-- Signboard / Label -->
    <g class="signboard-group">
      <!-- Watercolor Wash Backing -->
      <rect x="470" y="655" width="260" height="54" rx="4" fill="#72a9e8" fill-opacity="0.6" filter="url(#watercolor-wash)" class="sign-wash" />
      <!-- Paper Card -->
      <rect x="475" y="650" width="250" height="50" rx="2" fill="#ffffff" stroke="#1c1c1c" stroke-width="2" class="sign-card" />
      <!-- Double ink corner ticks -->
      <path d="M 480 655 L 490 655 M 480 655 L 480 665" stroke="#1c1c1c" stroke-width="1.2" />
      <path d="M 720 655 L 710 655 M 720 655 L 720 665" stroke="#1c1c1c" stroke-width="1.2" />
      <path d="M 480 695 L 490 695 M 480 695 L 480 685" stroke="#1c1c1c" stroke-width="1.2" />
      <path d="M 720 695 L 710 695 M 720 695 L 720 685" stroke="#1c1c1c" stroke-width="1.2" />
      
      <!-- Typography (Montserrat, English) -->
      <text x="600" y="675" font-family="'Montserrat', sans-serif" font-size="16" font-weight="700" fill="#1c1c1c" text-anchor="middle" letter-spacing="1.5">WHAT I DID</text>
      <text x="600" y="692" font-family="'Montserrat', sans-serif" font-size="10.5" font-weight="500" fill="#555" text-anchor="middle" letter-spacing="2">PAST • 6 GALLERIES</text>
    </g>
  </g>

  <!-- TARGET 2: "What I'm doing" - Present (LEFT) -->
  <g id="hotspot-present" class="museum-hotspot hotspot-left" data-target="present" cursor="pointer">
    <polygon points="50,220 290,310 290,660 50,780" fill="transparent" class="hotspot-bg" />
    <ellipse cx="170" cy="650" rx="100" ry="50" fill="#72a9e8" fill-opacity="0.0" class="hotspot-wash" filter="url(#watercolor-wash)" />

    <!-- Left Perspective Arrow -->
    <g class="arrow-group">
      <!-- Watercolor shadow -->
      <path d="M 90 680 L 170 610 L 160 635 L 230 615 L 235 650 L 165 670 L 160 695 Z" 
            fill="#72a9e8" fill-opacity="0.6" filter="url(#watercolor-wash)" class="arrow-wash" />
      <!-- Arrow line work -->
      <path d="M 90 680 L 170 610 L 160 635 L 230 615 L 235 650 L 165 670 L 160 695 Z" 
            fill="#ffffff" stroke="#1c1c1c" stroke-width="2.5" stroke-linejoin="round" class="arrow-body" />
      <line x1="180" y1="630" x2="215" y2="620" stroke="#1c1c1c" stroke-width="1.2" />
      <line x1="180" y1="650" x2="215" y2="640" stroke="#1c1c1c" stroke-width="1.2" />
    </g>

    <!-- Left Signboard -->
    <g class="signboard-group">
      <rect x="65" y="705" width="220" height="52" rx="4" fill="#72a9e8" fill-opacity="0.6" filter="url(#watercolor-wash)" class="sign-wash" />
      <rect x="70" y="700" width="210" height="48" rx="2" fill="#ffffff" stroke="#1c1c1c" stroke-width="2" class="sign-card" />
      <text x="175" y="723" font-family="'Montserrat', sans-serif" font-size="15" font-weight="700" fill="#1c1c1c" text-anchor="middle" letter-spacing="1">WHAT I'M DOING</text>
      <text x="175" y="739" font-family="'Montserrat', sans-serif" font-size="10" font-weight="500" fill="#555" text-anchor="middle" letter-spacing="1.5">PRESENT • STUDIO</text>
    </g>
  </g>

  <!-- TARGET 3: "What I plan to do" - Future (RIGHT) -->
  <g id="hotspot-future" class="museum-hotspot hotspot-right" data-target="future" cursor="pointer">
    <polygon points="1150,220 910,310 910,660 1150,780" fill="transparent" class="hotspot-bg" />
    <ellipse cx="1030" cy="650" rx="100" ry="50" fill="#72a9e8" fill-opacity="0.0" class="hotspot-wash" filter="url(#watercolor-wash)" />

    <!-- Right Perspective Arrow -->
    <g class="arrow-group">
      <!-- Watercolor shadow -->
      <path d="M 1110 680 L 1030 610 L 1040 635 L 970 615 L 965 650 L 1035 670 L 1040 695 Z" 
            fill="#72a9e8" fill-opacity="0.6" filter="url(#watercolor-wash)" class="arrow-wash" />
      <!-- Arrow line work -->
      <path d="M 1110 680 L 1030 610 L 1040 635 L 970 615 L 965 650 L 1035 670 L 1040 695 Z" 
            fill="#ffffff" stroke="#1c1c1c" stroke-width="2.5" stroke-linejoin="round" class="arrow-body" />
      <line x1="1020" y1="630" x2="985" y2="620" stroke="#1c1c1c" stroke-width="1.2" />
      <line x1="1020" y1="650" x2="985" y2="640" stroke="#1c1c1c" stroke-width="1.2" />
    </g>

    <!-- Right Signboard -->
    <g class="signboard-group">
      <rect x="915" y="705" width="220" height="52" rx="4" fill="#72a9e8" fill-opacity="0.6" filter="url(#watercolor-wash)" class="sign-wash" />
      <rect x="920" y="700" width="210" height="48" rx="2" fill="#ffffff" stroke="#1c1c1c" stroke-width="2" class="sign-card" />
      <text x="1025" y="723" font-family="'Montserrat', sans-serif" font-size="15" font-weight="700" fill="#1c1c1c" text-anchor="middle" letter-spacing="1">WHAT I PLAN TO DO</text>
      <text x="1025" y="739" font-family="'Montserrat', sans-serif" font-size="10" font-weight="500" fill="#555" text-anchor="middle" letter-spacing="1.5">FUTURE • SKETCHBOOK</text>
    </g>
  </g>
</svg>