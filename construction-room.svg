<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750" width="100%" height="100%" class="sketch-svg">
  
  <defs>
    <!-- Paper Texture Filter -->
    <filter id="paper-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#fdfbf7" surfaceScale="1.2" result="light">
        <feDistantLight azimuth="60" elevation="50" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light" />
    </filter>

    <!-- Watercolor Bleed Filter -->
    <filter id="watercolor-wash" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" result="rough" />
      <feDisplacementMap in="SourceGraphic" in2="rough" scale="8" xChannelSelector="R" yChannelSelector="G" result="displaced" />
      <feGaussianBlur stdDeviation="2.5" result="blurred" />
      <feMerge>
        <feMergeNode in="blurred" />
        <feMergeNode in="displaced" opacity="0.8" />
      </feMerge>
    </filter>

    <!-- Ink Hatching Pattern 45 deg -->
    <pattern id="hatch-45" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#2b2b2b" stroke-width="0.8" opacity="0.45" />
    </pattern>

    <!-- Cross Hatching Pattern -->
    <pattern id="cross-hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#1f1f1f" stroke-width="0.7" opacity="0.4" />
      <line x1="0" y1="0" x2="8" y2="0" stroke="#1f1f1f" stroke-width="0.7" opacity="0.4" />
    </pattern>

    <!-- Dense Hatching for Architectural Poche -->
    <pattern id="dense-poche" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#202020" stroke-width="1.2" opacity="0.65" />
    </pattern>
  </defs>

  <rect width="1100" height="750" fill="#faf8f5" />

  <!-- Room Interior in Vanishing Perspective: (550, 240) -->
  <!-- Back Wall -->
  <polygon points="300,120 800,120 800,480 300,480" fill="#f4efe6" stroke="#1c1c1c" stroke-width="2.5" />
  
  <!-- Left Wall & Draped Tarpaulin/Curtain -->
  <polygon points="0,0 300,120 300,480 0,750" fill="#ede7dc" stroke="#1c1c1c" stroke-width="2" />
  <!-- Draped Cloth over left partition -->
  <path d="M 140 50 Q 220 180 180 340 Q 140 480 160 620 L 260 520 L 260 105 Z" fill="#e2dacb" stroke="#1c1c1c" stroke-width="1.8" />
  <path d="M 170 120 Q 240 260 210 420" fill="none" stroke="#222" stroke-width="1.2" stroke-dasharray="4,4" />
  <path d="M 120 20 Q 180 80 160 180" fill="none" stroke="#222" stroke-width="1.5" />

  <!-- Right Wall with Ladder Leaning -->
  <polygon points="1100,0 800,120 800,480 1100,750" fill="#ede7dc" stroke="#1c1c1c" stroke-width="2" />
  
  <!-- Ceiling & Floor -->
  <polygon points="0,0 1100,0 800,120 300,120" fill="#f9f7f2" stroke="#1c1c1c" stroke-width="1.8" />
  <polygon points="0,750 300,480 800,480 1100,750" fill="#f1ebe0" stroke="#1c1c1c" stroke-width="2" />

  <!-- Perspective Floor Planks -->
  <g stroke="#3a3835" stroke-width="1" opacity="0.45">
    <line x1="550" y1="480" x2="550" y2="750" />
    <line x1="420" y1="480" x2="260" y2="750" />
    <line x1="680" y1="480" x2="840" y2="750" />
    <line x1="160" y1="610" x2="940" y2="610" />
  </g>

  <!-- Pinned Architectural Blueprints on Back Wall -->
  <g transform="translate(360, 160)" stroke="#1c1c1c" stroke-width="1.2">
    <rect x="0" y="0" width="130" height="90" fill="#ffffff" />
    <rect x="5" y="5" width="120" height="80" fill="#72a9e8" fill-opacity="0.15" />
    <line x1="15" y1="20" x2="115" y2="20" stroke="#72a9e8" stroke-width="1" />
    <line x1="15" y1="35" x2="115" y2="35" stroke="#72a9e8" stroke-width="1" stroke-dasharray="3,2" />
    <circle cx="65" cy="55" r="18" fill="none" stroke="#72a9e8" stroke-width="1" />
    <!-- Pushpins -->
    <circle cx="8" cy="8" r="3" fill="#222" />
    <circle cx="122" cy="8" r="3" fill="#222" />
  </g>

  <!-- ================= TIMBER STEPLADDER (RIGHT WALL) ================= -->
  <!-- Correct perspective: ladder leaning from floor to upper right wall -->
  <g id="ladder" stroke="#1c1c1c" stroke-width="2.5" fill="none">
    <!-- Left Stile -->
    <line x1="880" y1="680" x2="820" y2="170" stroke-width="3" />
    <!-- Right Stile -->
    <line x1="970" y1="695" x2="870" y2="180" stroke-width="3" />
    <!-- Ladder Rungs (Steps) -->
    <line x1="875" y1="630" x2="960" y2="643" stroke-width="2.2" />
    <line x1="865" y1="565" x2="945" y2="577" stroke-width="2.2" />
    <line x1="855" y1="500" x2="930" y2="510" stroke-width="2.2" />
    <line x1="845" y1="435" x2="915" y2="444" stroke-width="2.2" />
    <line x1="838" y1="370" x2="900" y2="378" stroke-width="2.2" />
    <line x1="832" y1="305" x2="888" y2="312" stroke-width="2.2" />
    <line x1="826" y1="240" x2="878" y2="246" stroke-width="2.2" />
    <!-- Paint Splatter on Ladder (#72a9e8) -->
    <circle cx="865" cy="500" r="5" fill="#72a9e8" fill-opacity="0.8" stroke="none" />
    <circle cx="945" cy="577" r="4" fill="#72a9e8" fill-opacity="0.8" stroke="none" />
    <path d="M 855 435 Q 860 455 858 465" stroke="#72a9e8" stroke-width="2.5" />
  </g>

  <!-- ================= PAINT BUCKET & SPILLED BLUE WASH ================= -->
  <g id="paint-bucket" transform="translate(680, 470)">
    <!-- Blue Watercolor Puddle Spilling on Floor -->
    <path d="M -15 80 Q 20 95 60 85 Q 110 90 90 65 Q 60 55 20 60 Z" fill="#72a9e8" fill-opacity="0.6" filter="url(#watercolor-wash)" />
    <!-- Bucket Body -->
    <polygon points="10,25 70,25 62,75 18,75" fill="#ffffff" stroke="#1c1c1c" stroke-width="2.2" />
    <ellipse cx="40" cy="25" rx="30" ry="7" fill="#ece5d8" stroke="#1c1c1c" stroke-width="2" />
    <ellipse cx="40" cy="25" rx="24" ry="5.5" fill="#72a9e8" fill-opacity="0.8" filter="url(#watercolor-wash)" />
    <!-- Handle -->
    <path d="M 10 25 C 10 -5 70 -5 70 25" fill="none" stroke="#1c1c1c" stroke-width="1.8" />
    <!-- Stirrer / Brush with blue dripping tip -->
    <line x1="35" y1="22" x2="15" y2="-20" stroke="#8a5d3b" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="-20" x2="22" y2="-17" stroke="#1c1c1c" stroke-width="1.5" />
    <circle cx="22" cy="78" r="4" fill="#72a9e8" fill-opacity="0.9" />
    <circle cx="36" cy="84" r="3" fill="#72a9e8" fill-opacity="0.8" />
  </g>

  <!-- ================= HIGHLIGHTED CARDBOARD BOXES / CRATES ================= -->
  <!-- User requirement: "các hộp đồ. Hãy highlight các thùng đồ này lên để người xem biết mà bấm vào." -->
  <g id="construction-boxes" class="clickable-crate" data-action="open-present" cursor="pointer">
    
    <!-- Luminous Blue Watercolor Glow & Aura -->
    <ellipse cx="380" cy="620" rx="260" ry="90" fill="#72a9e8" fill-opacity="0.45" filter="url(#watercolor-wash)" class="crate-aura" />
    
    <!-- CRATE 1 (Foreground Large Crate: x=140, y=470, w=220, h=190) -->
    <g class="crate crate-main">
      <!-- Cast Shadow -->
      <polygon points="120,665 370,665 390,620 140,620" fill="#72a9e8" fill-opacity="0.35" filter="url(#watercolor-wash)" />
      
      <!-- Box Front Face -->
      <polygon points="130,520 310,490 310,660 130,680" fill="#fdfbf7" stroke="#1c1c1c" stroke-width="3" class="crate-face" />
      <!-- Box Right Face (Perspective) -->
      <polygon points="310,490 410,440 410,590 310,660" fill="#eae3d2" stroke="#1c1c1c" stroke-width="3" class="crate-face" />
      <!-- Box Top Face -->
      <polygon points="130,520 230,470 410,440 310,490" fill="#ffffff" stroke="#1c1c1c" stroke-width="3" class="crate-face" />

      <!-- Watercolor Shading inside the crate (#72a9e8 at 60%) -->
      <polygon points="130,520 310,490 310,660 130,680" fill="#72a9e8" fill-opacity="0.3" filter="url(#watercolor-wash)" />
      <polygon points="130,520 230,470 410,440 310,490" fill="#72a9e8" fill-opacity="0.5" filter="url(#watercolor-wash)" />

      <!-- Packaging Tape (cross & seam lines) -->
      <path d="M 220 472 L 220 670" stroke="#72a9e8" stroke-width="12" stroke-opacity="0.8" />
      <path d="M 220 472 L 220 670" stroke="#1c1c1c" stroke-width="1.5" stroke-dasharray="4,4" fill="none" />
      
      <!-- Cardboard Flute / Grain hatching -->
      <g stroke="#1c1c1c" stroke-width="0.8" opacity="0.35">
        <line x1="145" y1="540" x2="145" y2="665" />
        <line x1="165" y1="535" x2="165" y2="665" />
        <line x1="275" y1="515" x2="275" y2="645" />
        <line x1="295" y1="510" x2="295" y2="640" />
      </g>

      <!-- Stamp / Label: "FRAGILE • STATIONERY BOARDGAME" -->
      <g transform="translate(145, 560) rotate(-5)">
        <rect x="0" y="0" width="130" height="60" rx="3" fill="#ffffff" stroke="#1c1c1c" stroke-width="1.8" />
        <rect x="0" y="0" width="130" height="15" fill="#72a9e8" fill-opacity="0.7" />
        <text x="65" y="11" font-family="'Montserrat', sans-serif" font-size="8" font-weight="700" fill="#1c1c1c" text-anchor="middle" letter-spacing="1">PROJECT CRATE</text>
        <text x="65" y="32" font-family="'Montserrat', sans-serif" font-size="10" font-weight="700" fill="#1c1c1c" text-anchor="middle">EVERYDAY</text>
        <text x="65" y="46" font-family="'Montserrat', sans-serif" font-size="10" font-weight="700" fill="#1c1c1c" text-anchor="middle">STATIONERY</text>
      </g>
    </g>

    <!-- CRATE 2 (Adjacent Crate behind: x=340, y=450) -->
    <g class="crate crate-sub">
      <polygon points="340,480 470,460 470,580 340,600" fill="#f5eee3" stroke="#1c1c1c" stroke-width="2.5" />
      <polygon points="470,460 540,425 540,535 470,580" fill="#dfd6c4" stroke="#1c1c1c" stroke-width="2.5" />
      <polygon points="340,480 410,445 540,425 470,460" fill="#ffffff" stroke="#1c1c1c" stroke-width="2.5" />
      <polygon points="340,480 470,460 470,580 340,600" fill="#72a9e8" fill-opacity="0.4" filter="url(#watercolor-wash)" />
      
      <!-- Handle cutout slot -->
      <rect x="385" y="500" width="40" height="14" rx="7" fill="#2b2620" stroke="#1c1c1c" stroke-width="1.5" />
    </g>

    <!-- Interactive Call-to-Action Indicator (Bouncing sketch hand/arrow + pulse) -->
    <g class="crate-cta" transform="translate(260, 400)">
      <!-- Pulsing Watercolor Badge -->
      <rect x="-10" y="-10" width="220" height="52" rx="26" fill="#72a9e8" fill-opacity="0.8" filter="url(#watercolor-wash)" class="cta-pulse" />
      <rect x="-8" y="-8" width="216" height="48" rx="24" fill="#ffffff" stroke="#1c1c1c" stroke-width="2.2" />
      <!-- Icon + Text -->
      <polygon points="12,16 28,6 28,26" fill="#1c1c1c" />
      <text x="40" y="21" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" fill="#1c1c1c" letter-spacing="1">CLICK TO UNPACK</text>
      <!-- Downward Arrow pointing at box -->
      <path d="M 100 45 L 100 70 M 90 60 L 100 70 L 110 60" stroke="#1c1c1c" stroke-width="2.5" fill="none" stroke-linecap="round" />
    </g>
  </g>
</svg>